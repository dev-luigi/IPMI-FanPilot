server:
  host: 0.0.0.0
  port: 3000
  # Serve over HTTPS. With no cert_file/key_file set, a self-signed certificate is
  # created under <data_dir>/certs/ on the first start and used automatically.
  # Browsers will warn that the issuer is unknown — see the README for how to import
  # it, or point the two settings below at your own certificate.
  # Env: IPMIDECK_SERVER_HTTPS / IPMIDECK_SERVER_CERT_FILE / IPMIDECK_SERVER_KEY_FILE
  https: false
  # cert_file: /path/to/cert.pem
  # key_file: /path/to/key.pem

auth:
  enabled: true
  session_expiry: 24h
  max_login_attempts: 5

ipmi:
  poll_interval: 5            # seconds
  power_poll_interval: 10     # seconds
  command_timeout: 10         # seconds

data:
  retention_days: 365
  cleanup_interval: 24h

logging:
  level: info                 # debug, info, warning, error

modules:
  sensors:
    enabled: true
  fanpilot:
    enabled: true
  power:
    enabled: true
  sel:
    enabled: true
  fru:
    enabled: true
